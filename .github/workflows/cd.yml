name: CD

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'chart/**'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  CLUSTER_NAME: the-store
  NAMESPACE: the-store
  RELEASE: the-store

jobs:
  publish:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: [catalog, cart, orders, checkout, ui]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/the-store-${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: src/${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    name: Deploy to Kind
    needs: publish
    # Self-hosted runner on the machine that hosts the Kind cluster
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check cluster
        run: |
          kind get clusters | grep -qx "$CLUSTER_NAME" || { echo "Kind cluster '$CLUSTER_NAME' not found"; exit 1; }
          kubectl --context "kind-$CLUSTER_NAME" get nodes

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Pull images and load them into Kind
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          for svc in catalog cart orders checkout ui; do
            img="${REGISTRY}/${OWNER}/the-store-${svc}:${GITHUB_SHA}"
            docker pull "$img"
            kind load docker-image "$img" --name "$CLUSTER_NAME"
          done

      - name: Helm upgrade
        run: |
          helm upgrade --install "$RELEASE" ./chart \
            --kube-context "kind-$CLUSTER_NAME" \
            --namespace "$NAMESPACE" --create-namespace \
            --set image.registry="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/" \
            --set image.tag="$GITHUB_SHA" \
            --atomic --timeout 5m

      - name: Release history
        if: always()
        run: helm history "$RELEASE" --kube-context "kind-$CLUSTER_NAME" --namespace "$NAMESPACE" --max 5

      - name: Smoke test (/health via Ingress)
        run: |
          for svc in catalog carts orders checkout ui; do
            echo "-> $svc"
            curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "http://localhost/health/$svc"
            echo
          done
